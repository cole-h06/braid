[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "braid"
version = "1.0.0"
description = "Reference implementation of the BRAID algorithm"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
include = ["braid*"]

[tool.pytest.ini_options]
pythonpath = ["src", "experiments/applied"]
testpaths = [
    "tests",
    "experiments/applied/agent_dataset/tests",
]